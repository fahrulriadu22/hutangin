name: hutangin_apk
description: Aplikasi catatan hutang pintar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  google_sign_in: ^6.1.0
  
  # UI
  provider: ^6.1.1
  intl: ^0.18.1
  flutter_svg: ^2.0.9
  
  # Notification
  onesignal_flutter: ^5.0.0
  
  # Utility
  shared_preferences: ^2.2.2
  image_picker: ^1.0.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600