name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Backup code
        run: |
          mkdir -p ../backup
          cp -r lib ../backup/
          cp pubspec.yaml ../backup/
          cp -r assets ../backup/ 2>/dev/null || true
          cp android/app/google-services.json ../backup/ 2>/dev/null || true
      
      - name: Delete old android folder
        run: rm -rf android
      
      - name: Create fresh Flutter project with v2 embedding
        run: |
          cd ..
          flutter create --platforms=android --project-name=hutangin hutangin_fresh
          cd hutangin_fresh
      
      - name: Copy code to fresh project
        run: |
          cp -r ../backup/lib/* ../hutangin_fresh/lib/
          cp ../backup/pubspec.yaml ../hutangin_fresh/
          cp -r ../backup/assets ../hutangin_fresh/ 2>/dev/null || true
          cp ../backup/google-services.json ../hutangin_fresh/android/app/ 2>/dev/null || true
      
      - name: Copy android folder back
        run: |
          rm -rf android
          cp -r ../hutangin_fresh/android .
      
      - name: Update build.gradle for compileSdk 34
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }
          
          android {
              namespace = "com.example.hutangin"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion
              
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              
              defaultConfig {
                  applicationId = "com.example.hutangin"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          
          flutter {
              source = "../.."
          }
          
          apply(plugin = "com.google.gms.google-services")
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
