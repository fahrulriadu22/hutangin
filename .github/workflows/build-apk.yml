name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'
      
      - name: Backup code and downgrade firebase versions
        run: |
          mkdir -p ../backup
          cp -r lib ../backup/
          cp -r assets ../backup/ 2>/dev/null || true
          cp android/app/google-services.json ../backup/ 2>/dev/null || true
          
          # Turunkan versi firebase di pubspec.yaml
          cat > pubspec.yaml << 'EOF'
          name: hutangin_apk
          description: Aplikasi catatan hutang pintar
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^2.24.2
            cloud_firestore: ^4.14.0
            firebase_auth: ^4.16.0
            google_sign_in: ^6.1.0
            provider: ^6.1.1
            intl: ^0.18.1
            flutter_svg: ^2.0.9
            onesignal_flutter: ^5.0.0
            shared_preferences: ^2.2.2
            image_picker: ^1.0.5
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
          EOF
      
      - name: Get package name from google-services.json
        id: get_package
        run: |
          PACKAGE=$(grep -o '"package_name": *"[^"]*"' ../backup/google-services.json | head -1 | cut -d'"' -f4)
          echo "package_name=$PACKAGE" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE"
      
      - name: Delete old android
        run: rm -rf android
      
      - name: Create fresh Flutter project
        run: |
          cd ..
          flutter create --platforms=android --project-name=hutangin hutangin_fresh
      
      - name: Copy code to fresh project
        run: |
          cp -r ../backup/lib/* ../hutangin_fresh/lib/
          cp pubspec.yaml ../hutangin_fresh/
          cp -r ../backup/assets ../hutangin_fresh/ 2>/dev/null || true
          cp ../backup/google-services.json ../hutangin_fresh/android/app/
      
      - name: Copy android folder back
        run: |
          cp -r ../hutangin_fresh/android .
      
      - name: Configure Gradle
        run: |
          # Hapus file .kts
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts
          
          PACKAGE_NAME="${{ steps.get_package.outputs.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.example.hutangin"
          fi
          
          # Buat build.gradle
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                  classpath 'com.google.gms:google-services:4.3.15'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # Buat app/build.gradle
          cat > android/app/build.gradle << EOF
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found.")
          }
          
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }
          
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }
          
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          
          android {
              namespace "$PACKAGE_NAME"
              compileSdk 34
              ndkVersion flutter.ndkVersion
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = '17'
              }
              
              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          
          flutter {
              source '../..'
          }
          
          apply plugin: 'com.google.gms.google-services'
          EOF
      
      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      
      - name: Fix AndroidManifest.xml
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Hutangin"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
      
      - name: Fix MainActivity
        run: |
          PACKAGE_NAME="${{ steps.get_package.outputs.package_name }}"
          PACKAGE_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          mkdir -p android/app/src/main/kotlin/$PACKAGE_PATH
          cat > android/app/src/main/kotlin/$PACKAGE_PATH/MainActivity.kt << EOF
          package $PACKAGE_NAME
          
          import io.flutter.embedding.android.FlutterActivity
          
          class MainActivity: FlutterActivity()
          EOF
      
      - name: Clean everything
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.pub-cache
          rm -rf android/.gradle
          flutter clean
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
