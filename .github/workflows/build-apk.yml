name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Wipe everything
        run: |
          rm -rf ~/.pub-cache
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/app/build
          rm -rf android/build
          rm -rf android/.gradle
      
      - name: Clean v1 embedding files from source
        run: |
          # Hapus semua file v1
          find . -name "GeneratedPluginRegistrant.*" -type f -delete
          find . -name "MainActivity.java" -type f -delete
          find . -name "io.flutter.app.FlutterActivity" -type f -delete
          rm -rf android/app/src/main/java/io/ 2>/dev/null || true
          rm -rf android/app/src/main/kotlin/io/ 2>/dev/null || true
      
      - name: Ensure AndroidManifest has v2
        run: |
          # Backup dulu
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.bak
          
          # Hapus meta-data lama
          sed -i '/flutterEmbedding/d' android/app/src/main/AndroidManifest.xml
          
          # Tambah meta-data baru di tempat yang benar
          sed -i 's/<\/application>/    <meta-data android:name="flutterEmbedding" android:value="2" \/>\n<\/application>/' android/app/src/main/AndroidManifest.xml
      
      - name: Fix gradle.properties
        run: |
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2g" >> android/gradle.properties
      
      - name: Fix local.properties
        run: |
          echo "flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.16.0-x64" > android/local.properties
      
      - name: Fix MainActivity.kt
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/hutangin_apk
          cat > android/app/src/main/kotlin/com/example/hutangin_apk/MainActivity.kt << 'EOF'
          package com.example.hutangin_apk
          
          import io.flutter.embedding.android.FlutterActivity
          
          class MainActivity: FlutterActivity()
          EOF
      
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
