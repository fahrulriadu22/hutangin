name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Create fresh project structure
        run: |
          # Backup lib dan assets
          mkdir -p ../backup
          cp -r lib ../backup/
          cp -r assets ../backup/ 2>/dev/null || true
          cp pubspec.yaml ../backup/
          cp android/app/google-services.json ../backup/
          
          # Hapus android folder
          rm -rf android
          
          # Buat project Flutter baru
          cd ..
          flutter create --platforms=android --project-name=hutangin hutangin_fresh
          
          # Copy kode lama
          cp -r ../backup/lib/* hutangin_fresh/lib/
          cp ../backup/pubspec.yaml hutangin_fresh/
          cp -r ../backup/assets hutangin_fresh/ 2>/dev/null || true
          cp ../backup/google-services.json hutangin_fresh/android/app/
          
          # Copy android folder balik
          cp -r hutangin_fresh/android ../hutangin/
          
          cd ../hutangin
      
      - name: Fix google-services.json location
        run: |
          # Pastikan google-services.json ada di tempat yang benar
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ google-services.json found"
          else
            echo "❌ google-services.json not found"
            exit 1
          fi
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
