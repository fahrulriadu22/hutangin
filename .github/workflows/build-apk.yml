name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Backup code
        run: |
          mkdir -p ../backup
          cp -r lib ../backup/
          cp -r assets ../backup/ 2>/dev/null || true
          cp pubspec.yaml ../backup/
          cp android/app/google-services.json ../backup/
      
      - name: Delete android folder
        run: rm -rf android
      
      - name: Regenerate android folder dengan Flutter 3.44.1
        run: |
          cd ..
          flutter create --platforms=android --project-name=hutangin hutangin_new
          cd hutangin_new
          
          # Copy code dan assets
          cp -r ../backup/lib/* lib/
          cp ../backup/pubspec.yaml .
          cp -r ../backup/assets . 2>/dev/null || true
          cp ../backup/google-services.json android/app/
          
          # Copy android folder kembali ke repo
          cp -r android ../hutangin/
          
          cd ../hutangin
      
      - name: Clean and build
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.pub-cache
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter clean
          flutter pub get
          flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
