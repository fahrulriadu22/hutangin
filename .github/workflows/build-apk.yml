name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Backup code
        run: |
          mkdir ../backup
          cp -r lib ../backup/
          cp pubspec.yaml ../backup/
          cp -r assets ../backup/ 2>/dev/null || true
      
      - name: Delete android folder
        run: |
          rm -rf android
      
      - name: Create new Flutter project
        run: |
          cd ..
          flutter create --platforms=android hutangin_new
          cd hutangin_new
      
      - name: Copy code to new project
        run: |
          cp -r ../backup/lib/* ../hutangin_new/lib/
          cp ../backup/pubspec.yaml ../hutangin_new/
          cp -r ../backup/assets ../hutangin_new/ 2>/dev/null || true
      
      - name: Copy android folder back
        run: |
          cp -r ../hutangin_new/android .
          cp -r ../hutangin_new/pubspec.yaml .
      
      - name: Fix google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "",
              "project_id": "dummy"
            },
            "client": []
          }
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
