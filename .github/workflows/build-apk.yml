name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Backup lib and assets
        run: |
          mkdir -p backup
          cp -r lib backup/
          cp -r assets backup/ 2>/dev/null || true
          cp pubspec.yaml backup/
          cp android/app/google-services.json backup/ 2>/dev/null || true
      
      - name: Delete android
        run: rm -rf android
      
      - name: Create fresh project
        run: |
          flutter create --platforms=android --project-name=hutangin fresh
      
      - name: Copy code to fresh project
        run: |
          cp -r backup/lib/* fresh/lib/
          cp backup/pubspec.yaml fresh/
          cp -r backup/assets fresh/ 2>/dev/null || true
          cp backup/google-services.json fresh/android/app/ 2>/dev/null || true
      
      - name: Copy android back with compileSdk 36
        run: |
          cp -r fresh/android .
          
          # Buat build.gradle.kts dengan compileSdk 36
          cat > android/app/build.gradle.kts << 'EOF'
          import org.jetbrains.kotlin.config.KotlinCompilerVersion
          
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          
          android {
              namespace = "com.example.hutangin_apk"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion
              
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = "17"
              }
              
              defaultConfig {
                  applicationId = "com.example.hutangin_apk"
                  minSdk = 23
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          
          flutter {
              source = "../.."
          }
          
          apply(plugin = "com.google.gms.google-services")
          EOF
          
          cat > android/build.gradle.kts << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.1.0")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
                  classpath("com.google.gms:google-services:4.4.0")
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          tasks.register("clean", Delete::class) {
              delete(rootProject.buildDir)
          }
          EOF
      
      - name: Fix local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      
      - name: Fix AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Hutangin" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF
      
      - name: Fix MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/hutangin_apk
          cat > android/app/src/main/kotlin/com/example/hutangin_apk/MainActivity.kt << 'EOF'
          package com.example.hutangin_apk
          
          import io.flutter.embedding.android.FlutterActivity
          
          class MainActivity: FlutterActivity()
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
