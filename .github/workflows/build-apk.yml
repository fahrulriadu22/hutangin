name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Backup lib and assets
        run: |
          mkdir -p backup
          cp -r lib backup/
          cp -r assets backup/ 2>/dev/null || true
          cp pubspec.yaml backup/
          cp android/app/google-services.json backup/ 2>/dev/null || true
      
      - name: Delete android
        run: rm -rf android
      
      - name: Create fresh project
        run: |
          flutter create --platforms=android --project-name=hutangin fresh
      
      - name: Copy code to fresh project
        run: |
          cp -r backup/lib/* fresh/lib/
          cp backup/pubspec.yaml fresh/
          cp -r backup/assets fresh/ 2>/dev/null || true
          cp backup/google-services.json fresh/android/app/ 2>/dev/null || true
      
      - name: Copy android back and force compileSdk 34
        run: |
          cp -r fresh/android .
          
          # Force compileSdk ke 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          
          # Force targetSdk ke 34
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          
          # Cek hasilnya
          cat android/app/build.gradle | grep -E "(compileSdk|targetSdk)"
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
