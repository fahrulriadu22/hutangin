name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Hapus semua file .kts
        run: |
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts
          rm -f android/settings.gradle.kts
      
      - name: Get package name
        id: get_package
        run: |
          PACKAGE=$(grep -o '"package_name": *"[^"]*"' android/app/google-services.json | head -1 | cut -d'"' -f4)
          echo "package_name=$PACKAGE" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE"
      
      - name: Clean cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.pub-cache
          rm -rf android/.gradle
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter clean
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
