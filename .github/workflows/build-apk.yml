name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Update pubspec.yaml with latest Firebase
        run: |
          cat > pubspec.yaml << 'EOF'
          name: hutangin_apk
          description: Aplikasi catatan hutang pintar
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.13.0
            cloud_firestore: ^5.7.0
            firebase_auth: ^5.5.0
            google_sign_in: ^6.3.0
            provider: ^6.1.1
            intl: ^0.19.0
            flutter_svg: ^2.0.10
            shared_preferences: ^2.3.0
            image_picker: ^1.1.0
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
          
          flutter:
            uses-material-design: true
          EOF
      
      - name: Clean and get dependencies
        run: |
          rm -rf ~/.pub-cache
          rm -rf .dart_tool
          rm -f pubspec.lock
          rm -rf android
          flutter clean
          flutter pub get
      
      - name: Create android folder
        run: flutter create --platforms=android .
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
