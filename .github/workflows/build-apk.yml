name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Clean project
        run: |
          rm -f pubspec.lock
          rm -rf .dart_tool
          rm -rf build
      
      - name: Recreate android folder
        run: |
          # Backup lib dan pubspec
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml
          
          # Buat project baru
          cd ..
          flutter create --platforms=android hutangin_new
          cd hutangin_new
          
          # Copy kode lama ke project baru
          cp -r ../hutangin_apk/lib/* lib/
          cp ../hutangin_apk/pubspec.yaml .
          
          # Hapus folder android yang lama
          rm -rf ../hutangin_apk/android
          
          # Copy android folder baru ke project lama
          cp -r android ../hutangin_apk/
          
          cd ../hutangin_apk
      
      - name: Fix pubspec
        run: |
          flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
