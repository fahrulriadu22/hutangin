name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'  # Turunkan versi ke yang lebih stabil
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create google-services.json
        run: |
          # Buat file dummy dulu (biar gak error)
          echo '{"project_info": {"project_number": "", "project_id": "dummy"}, "client": []}' > android/app/google-services.json
        shell: bash
      
      - name: Clean build
        run: flutter clean
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: hutangin-aab
          path: build/app/outputs/bundle/release/app-release.aab
