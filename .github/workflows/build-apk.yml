name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'
      
      - name: Backup code
        run: |
          mkdir -p ../backup
          cp -r lib ../backup/
          cp -r assets ../backup/ 2>/dev/null || true
          cp android/app/google-services.json ../backup/
      
      - name: Get package name
        id: get_package
        run: |
          PACKAGE=$(grep -o '"package_name": *"[^"]*"' ../backup/google-services.json | head -1 | cut -d'"' -f4)
          echo "package_name=$PACKAGE" >> $GITHUB_OUTPUT
      
      - name: Delete old android
        run: rm -rf android
      
      - name: Create fresh Flutter project
        run: |
          cd ..
          flutter create --platforms=android --project-name=hutangin hutangin_fresh
      
      - name: Copy code
        run: |
          cp -r ../backup/lib/* ../hutangin_fresh/lib/
          cp ../backup/google-services.json ../hutangin_fresh/android/app/
          cp -r ../backup/assets ../hutangin_fresh/ 2>/dev/null || true
      
      - name: Copy android back
        run: |
          cp -r ../hutangin_fresh/android .
      
      - name: Fix build.gradle with Kotlin 2.0.21
        run: |
          PACKAGE_NAME="${{ steps.get_package.outputs.package_name }}"
          
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '2.0.21'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                  classpath 'com.google.gms:google-services:4.3.15'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          cat > android/app/build.gradle << EOF
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found.")
          }
          
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          
          android {
              namespace "$PACKAGE_NAME"
              compileSdk 34
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = '17'
              }
              
              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          
          flutter {
              source '../..'
          }
          
          apply plugin: 'com.google.gms.google-services'
          EOF
      
      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      
      - name: Fix AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Hutangin" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF
      
      - name: Fix MainActivity
        run: |
          PACKAGE_NAME="${{ steps.get_package.outputs.package_name }}"
          PACKAGE_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          mkdir -p android/app/src/main/kotlin/$PACKAGE_PATH
          cat > android/app/src/main/kotlin/$PACKAGE_PATH/MainActivity.kt << EOF
          package $PACKAGE_NAME
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF
      
      - name: Clean cache total
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.pub-cache
          rm -rf android/.gradle
          rm -rf .dart_tool
          rm -f pubspec.lock
          rm -rf ~/.gradle/wrapper/
          flutter clean
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
