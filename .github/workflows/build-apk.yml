name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Backup code
        run: |
          mkdir -p backup
          cp -r lib backup/
          cp -r assets backup/ 2>/dev/null || true
          cp pubspec.yaml backup/
          cp android/app/google-services.json backup/ 2>/dev/null || true
      
      - name: Delete old android
        run: rm -rf android
      
      - name: Create fresh Flutter project
        run: |
          flutter create --platforms=android --project-name=hutangin fresh_project
      
      - name: Copy code to fresh project
        run: |
          cp -r backup/lib/* fresh_project/lib/
          cp backup/pubspec.yaml fresh_project/
          cp -r backup/assets fresh_project/ 2>/dev/null || true
          cp backup/google-services.json fresh_project/android/app/ 2>/dev/null || true
      
      - name: Copy android folder back
        run: |
          cp -r fresh_project/android .
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: hutangin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
